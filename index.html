<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZ2NEXTHOOPS — Scouting Reports &amp; Ranked Boards</title>
  <meta name="description" content="AZ2NEXTHOOPS — pro-level basketball scouting reports and ranked boards across NBA, College, G-League and International." />
  <link rel="icon" href="assets/az2nexthoops-logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#reports" aria-label="AZ2NEXTHOOPS home">
        <img src="assets/az2nexthoops-logo.jpg" alt="AZ2NEXTHOOPS logo" class="brand-logo" />
        <span class="brand-text">
          <span class="brand-name">AZ2NEXTHOOPS</span>
          <span class="brand-tag">Scouting Reports &amp; Ranked Boards</span>
        </span>
      </a>

      <nav class="main-nav" aria-label="Primary">
        <button class="nav-btn" data-view="reports">Reports</button>
        <button class="nav-btn" data-view="boards">Boards</button>
        <button class="nav-btn admin-toggle" id="adminToggle" title="Editor access (owner only)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span id="adminToggleLabel">Editor</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main id="app" class="wrap"></main>

  <!-- ===================== MODAL ROOT ===================== -->
  <div id="modalRoot"></div>

  <!-- ===================== TOAST ===================== -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
